[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/android",
  "crates/core",
  "crates/dev",
]
default-members = ["crates/core", "crates/dev"]
resolver = "2"

[workspace.package]
version = "1.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
bytes = "1"
chrono = "0.4"
form_urlencoded = "1"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
if-addrs = "0.13"
log = "0.4"
mdns-sd = "0.21"
mime_guess = "2"
percent-encoding = "2"
rand = "0.8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
