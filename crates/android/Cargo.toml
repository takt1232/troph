[package]
name = "pocketfiles-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pocketfiles"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
jni = "0.21"
log.workspace = true
pocketfiles-core = { path = "../core" }
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
